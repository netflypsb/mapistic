version: "3.9"

services:
  postgis:
    image: postgis/postgis:17-3.5-alpine
    container_name: mapistic-test-postgis
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: local_test_password_only
      POSTGRES_DB: mapistic
    ports:
      - "54329:5432"
    volumes:
      - ./packages/db/migrations/0001_postgis_init.sql:/docker-entrypoint-initdb.d/0001_postgis_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d mapistic"]
      interval: 3s
      timeout: 3s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: mapistic-test-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./services/valhalla:/custom_files

  photon:
    build:
      context: ./services/photon
    container_name: mapistic-test-photon
    ports:
      - "2322:2322"
